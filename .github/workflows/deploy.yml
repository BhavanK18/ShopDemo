name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/shopdemo
  CONTAINER_NAME: shop-app
  APP_PORT: 5000

jobs:
  build:
    name: Build & Push Docker Image
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: DockerHub Login
        run: |
          echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login \
            --username "${{ secrets.DOCKERHUB_USERNAME }}" \
            --password-stdin

      - name: Get Git SHA
        id: git_sha
        run: |
          SHA=$(git rev-parse --short HEAD)
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "Building commit: $SHA"

      - name: Build Docker Image
        run: |
          docker build \
            --tag "$IMAGE_NAME:${{ steps.git_sha.outputs.sha }}" \
            .

      - name: Tag Release
        run: |
          docker tag \
            "$IMAGE_NAME:${{ steps.git_sha.outputs.sha }}" \
            "$IMAGE_NAME:v1.2"

      - name: Push Git SHA Image
        run: |
          docker push "$IMAGE_NAME:${{ steps.git_sha.outputs.sha }}"

      - name: Push v1.2 Image
        run: |
          docker push "$IMAGE_NAME:v1.2"

  deploy:
    name: Deploy to EC2
    runs-on: self-hosted
    needs: build

    steps:
      - name: DockerHub Login
        run: |
          echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login \
            --username "${{ secrets.DOCKERHUB_USERNAME }}" \
            --password-stdin

      - name: Stop Existing Container
        run: |
          docker stop "$CONTAINER_NAME" 2>/dev/null || true
          docker rm "$CONTAINER_NAME" 2>/dev/null || true

      - name: Remove Container Using Port 5000
        run: |
          CONTAINERS=$(docker ps -q --filter "publish=${APP_PORT}")

          if [ -n "$CONTAINERS" ]; then
            docker stop $CONTAINERS
            docker rm $CONTAINERS
          fi

      - name: Pull New Image
        run: |
          docker pull "$IMAGE_NAME:v1.2"

      - name: Run Application
        run: |
          docker run -d \
            --name "$CONTAINER_NAME" \
            --publish "$APP_PORT:$APP_PORT" \
            --restart unless-stopped \
            "$IMAGE_NAME:v1.2"

      - name: Wait for Application
        run: |
          sleep 5

      - name: Check Container
        run: |
          docker ps
          docker logs --tail 30 "$CONTAINER_NAME"

      - name: Test Application
        run: |
          curl --fail --silent --show-error \
            "http://127.0.0.1:${APP_PORT}/"

      - name: Cleanup
        run: |
          docker image prune -f
